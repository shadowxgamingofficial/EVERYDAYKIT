
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">
<title>FARAH AI — Smart Reply Assistant</title>
<style>
:root {
  --bg:#090d18;
  --panel:#121a2b;
  --panel2:#1a263b;
  --text:#f5f7ff;
  --muted:#9ba9c2;
  --accent:#a78bfa;
  --accent2:#67e8b5;
  --border:#27344b;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,Arial,sans-serif;
  min-height:100vh;
}
button,textarea,select{font:inherit}
header{
  padding:22px 18px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;background:#090d18ee;
  backdrop-filter:blur(14px);z-index:5;
}
.logo{font-size:22px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--accent)}
.install{
  background:var(--panel2);border:1px solid var(--border);
  color:white;border-radius:12px;padding:10px 14px;
}
main{width:min(680px,100%);margin:auto;padding:28px 17px 110px}
.hero{text-align:center;padding:24px 0 28px}
.hero-icon{
  width:68px;height:68px;border-radius:23px;margin:auto;
  display:grid;place-items:center;font-size:31px;
  background:linear-gradient(135deg,#8b5cf6,#4f46e5);
  box-shadow:0 10px 35px #8b5cf633;
}
h1{font-size:31px;margin:17px 0 8px}
.hero p{color:var(--muted);margin:0}
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:19px;margin-bottom:17px;
}
.label{font-size:13px;font-weight:700;color:#cbd5e1;margin-bottom:10px;display:block}
textarea{
  width:100%;min-height:135px;resize:vertical;
  background:#0b1220;border:1px solid var(--border);
  border-radius:14px;padding:15px;color:white;outline:none;
}
textarea:focus,select:focus{border-color:var(--accent)}
select{
  width:100%;padding:13px;background:#0b1220;
  color:white;border:1px solid var(--border);border-radius:12px;
}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.generate{
  width:100%;padding:16px;border:0;border-radius:14px;
  background:linear-gradient(110deg,#8b5cf6,#6366f1);
  color:white;font-weight:800;font-size:16px;
  cursor:pointer;box-shadow:0 8px 25px #6366f133;
}
.generate:disabled{opacity:.6;cursor:wait}
.status{text-align:center;color:var(--muted);font-size:13px;margin:14px 0}
.results{display:none}
.reply{
  background:var(--panel);border:1px solid var(--border);
  border-radius:17px;padding:17px;margin-bottom:12px;
  animation:appear .35s ease both;
}
.reply-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.reply-title{font-weight:800;color:var(--accent2)}
.reply-text{line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{
  border:1px solid var(--border);background:var(--panel2);
  color:white;border-radius:9px;padding:8px 12px;cursor:pointer;
}
.error{
  color:#fecaca;background:#3b1820;border:1px solid #7f2938;
  border-radius:12px;padding:13px;display:none;margin-top:13px;
}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.whatsapp{
  position:fixed;right:17px;bottom:19px;z-index:10;
  display:flex;align-items:center;gap:9px;
  padding:13px 17px;border-radius:50px;
  background:#25D366;color:#fff;text-decoration:none;
  font-weight:800;box-shadow:0 6px 25px #0008;
}
.whatsapp-icon{font-size:23px}
@keyframes appear{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:430px){
  h1{font-size:27px}
  .settings{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo">FARAH<span> AI</span></div>
  <button class="install" id="installBtn">↓ Install</button>
</header>

<main>
  <section class="hero">
    <div class="hero-icon">✦</div>
    <h1>Your Smart Reply Assistant</h1>
    <p>Find the right words. Express yourself naturally.</p>
  </section>

  <section class="card">
    <label class="label" for="message">What message do you want to reply to?</label>
    <textarea id="message" maxlength="1500"
      placeholder="Paste the message here..."></textarea>
  </section>

  <section class="card">
    <div class="settings">
      <div>
        <label class="label" for="style">Reply style</label>
        <select id="style">
          <option value="cute">Cute</option>
          <option value="funny">Funny</option>
          <option value="confident">Confident</option>
          <option value="romantic">Romantic</option>
        </select>
      </div>
      <div>
        <label class="label" for="language">Language</label>
        <select id="language">
          <option value="English">English</option>
          <option value="Somali">Somali</option>
          <option value="Arabic">Arabic</option>
        </select>
      </div>
    </div>
  </section>

  <button class="generate" id="generateBtn">✦ Generate 3 Replies</button>
  <div class="status" id="status">Free to use · No sign-in screen</div>
  <div class="error" id="error"></div>

  <section class="results" id="results">
    <h2>Choose your reply ✨</h2>
    <div id="replyList"></div>
  </section>
</main>

<footer>
  FARAH AI · Made to help you express yourself
</footer>

<a class="whatsapp" href="https://wa.me/25290755352"
   target="_blank" rel="noopener noreferrer">
  <span class="whatsapp-icon">✆</span>
  <span>WhatsApp</span>
</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://datxluvurxqlwujmvqgf.supabase.co";
const SUPABASE_KEY = "sb_publishable__tZbhgg34IJxFM8rKPK01_A_CwMdCm6R";
const API_URL = SUPABASE_URL + "/functions/v1/farah-ai";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

const styles = {
  cute: ["friendly","friendly","empathetic"],
  funny: ["playful","playful","friendly"],
  confident: ["professional","concise","professional"],
  romantic: ["empathetic","friendly","empathetic"]
};

const variationInstructions = [
  "Give a natural, original reply. Make this version warm and natural.",
  "Give a clearly different alternative. Use fresh wording and a different sentence structure.",
  "Give another distinct alternative. Keep it natural, respectful and easy to send."
];

let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  deferredPrompt = event;
});

$("installBtn").addEventListener("click", async () => {
  if (!deferredPrompt) {
    alert("To install: open your browser menu and choose Add to Home screen.");
    return;
  }
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});

function showError(message) {
  $("error").textContent = message;
  $("error").style.display = "block";
}

function hideError() {
  $("error").style.display = "none";
}

function mapLanguage(value) {
  return value;
}

async function getAnonymousSession() {
  let { data, error } = await supabase.auth.getSession();

  if (error) throw error;

  if (!data.session) {
    const result = await supabase.auth.signInAnonymously();
    if (result.error) throw result.error;
    data = result.data;
  }

  if (!data.session?.access_token) {
    const refreshed = await supabase.auth.getSession();
    if (refreshed.error || !refreshed.data.session) {
      throw new Error("Could not start a secure anonymous session.");
    }
    data = refreshed.data;
  }

  return data.session.access_token;
}

async function getReply(message, language, style, variation, token) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      message: message + "\n\n" + variation,
      language: mapLanguage(language),
      style: style,
      history: []
    })
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || data.message || "Server error: " + response.status);
  }

  if (!data.reply) {
    throw new Error("The AI did not return a reply. Check your Edge Function.");
  }

  return data.reply;
}

function addReply(text, number) {
  const card = document.createElement("article");
  card.className = "reply";

  const top = document.createElement("div");
  top.className = "reply-top";

  const title = document.createElement("span");
  title.className = "reply-title";
  title.textContent = "Suggestion " + number;

  const copy = document.createElement("button");
  copy.className = "copy";
  copy.textContent = "Copy";

  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(text);
      copy.textContent = "Copied!";
      setTimeout(() => copy.textContent = "Copy", 1500);
    } catch {
      copy.textContent = "Copy unavailable";
    }
  });

  const content = document.createElement("div");
  content.className = "reply-text";
  content.textContent = text;

  top.append(title, copy);
  card.append(top, content);
  $("replyList").append(card);
}

$("generateBtn").addEventListener("click", async () => {
  const message = $("message").value.trim();
  const language = $("language").value;
  const selectedStyle = $("style").value;

  hideError();
  $("results").style.display = "none";
  $("replyList").replaceChildren();

  if (!message) {
    showError("Please paste a message first.");
    return;
  }

  const button = $("generateBtn");
  button.disabled = true;
  button.textContent = "✦ Creating your replies...";
  $("status").textContent = "Connecting securely to FARAH AI...";

  try {
    const token = await getAnonymousSession();
    const selectedStyles = styles[selectedStyle];

    const replies = await Promise.all(
      selectedStyles.map((style, index) =>
        getReply(message, language, style, variationInstructions[index], token)
      )
    );

    replies.forEach((reply, index) => addReply(reply, index + 1));
    $("results").style.display = "block";
    $("status").textContent = "Your three suggestions are ready ✨";
    $("results").scrollIntoView({behavior:"smooth"});
  } catch (error) {
    console.error(error);
    showError(error.message || "Something went wrong. Please try again.");
    $("status").textContent = "Could not generate replies.";
  } finally {
    button.disabled = false;
    button.textContent = "✦ Generate 3 Replies";
  }
});
</script>
</body>
</html>
